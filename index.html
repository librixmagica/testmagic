<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagicViewer</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Visor de contenidos mágicos">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Magic Viewer">
    
    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Ruffle Player -->
    <script src="ruffle/ruffle.js"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "autoplay": "on",
            "splashScreen": false,
            "unmuteOverlay": "hidden",
            "letterbox": "on",
            "contextMenu": false
        };
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            padding: 15px;
        }
        
        .header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .title {
            font-size: 16px;
            font-weight: lighter;
            text-align: left;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
        }
        
        .open-button {
            background: none;
            color: gray;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .open-button:hover {
            background-color: black;
        }
        
        .scan-standalone {
            width: 240px;
            max-width: 60vw;
            aspect-ratio: 1 / 1;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: transparent;
        }

        .scan-standalone:hover {
            background-color: black;
        }

        .scan-standalone img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 200px));
            justify-content: center;
            gap: 20px 5px;
            margin-top: 20px;
        }

        @media (min-width: 550px) {
            .grid-container {
                grid-template-columns: repeat(3, minmax(0, 200px));
            }
        }
        
        .magic-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 200px;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            padding: 2px;
            background: transparent;
            box-sizing: border-box;
        }
        
        .magic-item:hover {
            background-color: black;
        }
        
        .magic-icon {
            width: 100%;
            max-width: 180px;
            height: auto;
            aspect-ratio: 1 / 1;
        }
        
        .fullscreen-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh; /* dvh = dynamic viewport height: descuenta barras de navegador en mobile */
            background: black;
            z-index: 9999;
            display: none;
        }
        
        .fullscreen-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .fullscreen-swf {
            width: 100%;
            height: 100%;
            display: none;
            touch-action: none;
        }
        
        /* Prevenir menú contextual en todos los elementos */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .close-fullscreen {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            z-index: 10000;
            font-size: 16px;
        }
        
        /* Scanner de códigos */
        .scanner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 0;
        }
        
        .scanner-status {
            font-size: 12px;
            text-align: center;
            color: #5dc1b9;
        }
        
        #codeVideo {
            width: 220px;
            height: 220px;
            border: 1px solid #333;
            border-radius: 10%;
            object-fit: cover;
            margin-bottom: 3px;
        }
        /* Toast de error (#4) */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1a1a1a;
            color: #ff6b6b;
            border: 1px solid #333;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 99999;
            white-space: nowrap;
            max-width: 90vw;
            text-overflow: ellipsis;
            overflow: hidden;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div id="toast"></div>

    <div class="header">
        <div class="title">MagicViewer</div>
        <div class="button-group">
            <button class="open-button" onclick="toggleCodeScan()">|[:.:]|</button>
        </div>
    </div>
    
    <!-- Bloque de scan independiente, arriba y centrado -->
    <div class="scan-standalone" id="scanItem" onclick="startCodeScan()">
        <img src="scan.png" alt="Escanear" />
    </div>

    <!-- Code Scanner Container (QR, Data Matrix, etc.) -->
    <div id="codeScannerContainer" class="scan-standalone" style="display: none;" onclick="stopCodeScan()">
        <div class="scanner-container">
            <video id="codeVideo" autoplay playsinline></video>
            <div class="scanner-status" id="codeStatus">leyendo...</div>
        </div>
    </div>

    <div class="grid-container" id="magicGrid"></div>

    <div class="fullscreen-container" id="fullscreenContainer">
        <button class="close-fullscreen" onclick="closeFullscreen()">✕</button>
        <iframe class="fullscreen-iframe" id="fullscreenIframe"></iframe>
        <div class="fullscreen-swf" id="fullscreenSwf"></div>
    </div>

    <script src="dist/jszip.min.js"></script>
    <script src="umd/zxing.min.js"></script>
    <script>
        let codeReader = null;
        let activeBlobUrls = []; // #3: registrar blob URLs para liberar memoria al cerrar
        // Cada entrada: { url, type: 'icon' | 'content' }

        // #4: toast en lugar de alert()
        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // Cargar archivos .magic automáticamente al iniciar
        window.addEventListener('load', function() {
            loadMagicFilesFromRoot();
        });
        
        async function loadMagicFilesFromRoot() {
            try {
                // Fetch lista.txt con cache busting
                const timestamp = Date.now();
                const response = await fetch(`magicfiles/lista.txt?t=${timestamp}`);
                
                if (!response.ok) {
                    console.log('No se pudo cargar libreria');
                    return;
                }
                
                const text = await response.text();
                const fileNames = text.split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0 && line.endsWith('.magic'));
                
                const rootMagicFiles = [];

                // #5: fetch en paralelo en lugar de secuencial
                await Promise.all(fileNames.map(async (fileName) => {
                    try {
                        const fileResponse = await fetch(`magicfiles/${fileName}`);
                        if (fileResponse.ok) {
                            const blob = await fileResponse.blob();
                            rootMagicFiles.push({
                                name: fileName.replace(/\.magic$/, ''),
                                file: blob
                            });
                            console.log(`Archivo ${fileName} cargado automáticamente`);
                        }
                    } catch (error) {
                        console.log(`Error cargando ${fileName}:`, error);
                    }
                }));
                
                if (rootMagicFiles.length > 0) {
                    displayMagicFiles(rootMagicFiles);
                }
            } catch (error) {
                console.error('Error cargando libreria:', error);
            }
        }
        
        async function loadMagicFileFromRoot(fileName, fromScan = false) {
            try {
                console.log(`Intentando cargar: ${fileName}`);
                
                const response = await fetch(`magicfiles/${fileName}`);
                if (response.ok) {
                    const blob = await response.blob();
                    const magicFile = {
                        name: fileName.replace(/\.magic$/, ''),
                        file: blob
                    };
                    
                    console.log(`Archivo ${fileName} cargado exitosamente`);
                    
                    if (fromScan) {
                        // Desde escaneo QR: abrir directo en fullscreen SIN agregar al grid
                        await openMagicFile(magicFile);
                    } else {
                        // Desde lista.txt: mostrar en el grid
                        await displayMagicFiles([magicFile]);
                    }
                } else {
                    console.error(`Archivo ${fileName} no encontrado`);
                    showToast(`Librix no encontrado: ${fileName}`); // #4
                }
            } catch (error) {
                console.error('Error cargando archivo magico:', error);
                showToast(`Librix error: ${fileName}`); // #4
            }
        }
        
        // CODE SCANNER FUNCTIONS (QR, Data Matrix, etc.)
        function toggleCodeScan() {
            const codeScannerContainer = document.getElementById('codeScannerContainer');
            const isOpen = codeScannerContainer.style.display === 'flex';
            if (isOpen) {
                stopCodeScan();
            } else {
                startCodeScan();
            }
        }
        
        async function startCodeScan() {
            const codeScannerContainer = document.getElementById('codeScannerContainer');
            const codeStatus = document.getElementById('codeStatus');
            const scanItem = document.getElementById('scanItem');
            
            try {
                codeStatus.textContent = 'init cam...';
                document.querySelector('.open-button').style.color = '#5dc1b9';
                
                // Reemplazar el bloque de scan con el scanner
                scanItem.style.display = 'none';
                codeScannerContainer.style.display = 'flex';

                codeStatus.textContent = 'leyendo...';
                
                // Inicializar ZXing MultiFormatReader
                codeReader = new ZXing.BrowserAztecCodeReader();
                
                // Usar el método de ZXing que maneja todo automáticamente
                codeReader.decodeFromVideoDevice(undefined, 'codeVideo', (result, err) => {
                    if (result) {
                        const fileName = result.text;
                        const format = result.format;
                        
                        console.log('Código detectado:', fileName);
                        console.log('Formato:', format);
                        
                        codeStatus.textContent = 'Librix encontrado!';
                        
                        // Detener escaneo
                        stopCodeScan();
                        
                        // Asegurar que tenga la extensión .magic
                        const magicFileName = fileName.endsWith('.magic') ? fileName : fileName + '.magic';
                        
                        // Cargar el archivo con fromScan=true para abrir directo
                        loadMagicFileFromRoot(magicFileName, true);
                    }
                    
                    if (err && !(err instanceof ZXing.NotFoundException)) {
                        console.error('Error escaneando:', err);
                    }
                });
                
            } catch (error) {
                console.error('Error iniciando escáner:', error);
                codeStatus.textContent = 'Error: ' + error.message;
                showToast(`Error de cámara: ${error.message}`);
            }
        }
        
        function stopCodeScan() {
            if (codeReader) {
                codeReader.reset();
                codeReader = null;
            }
            
            const codeScannerContainer = document.getElementById('codeScannerContainer');
            codeScannerContainer.style.display = 'none';
            document.querySelector('.open-button').style.color = 'gray';
            
            // Restaurar el bloque de scan
            const scanItem = document.getElementById('scanItem');
            scanItem.style.display = 'flex';
        }
        
        async function displayMagicFiles(files) {
            const grid = document.getElementById('magicGrid');

            // #3: liberar íconos anteriores antes de limpiar el grid
            activeBlobUrls = activeBlobUrls.filter(entry => {
                if (entry.type === 'icon') {
                    URL.revokeObjectURL(entry.url);
                    return false;
                }
                return true;
            });

            grid.innerHTML = '';
            
            // #5: procesar íconos en paralelo y agregarlos al grid a medida que están listos
            await Promise.all(files.map(async (magicFile) => {
                try {
                    const zip = new JSZip();
                    const zipContent = await zip.loadAsync(magicFile.file);
                    
                    const iconFile = zipContent.files['icon.ico'];
                    if (iconFile) {
                        const iconBlob = await iconFile.async('blob');
                        const iconUrl = URL.createObjectURL(iconBlob);
                        activeBlobUrls.push({ url: iconUrl, type: 'icon' }); // #3: registrar para liberar después
                        
                        const item = document.createElement('div');
                        item.className = 'magic-item';
                        item.onclick = () => openMagicFile(magicFile);
                        
                        item.innerHTML = `
                            <img class="magic-icon" src="${iconUrl}" alt="${magicFile.name}" />
                        `;
                        
                        grid.appendChild(item); // aparece en cuanto está listo, sin esperar a los demás
                    }
                } catch (error) {
                    console.error('Error procesando archivo magico:', error);
                }
            }));
            
            window.currentMagicFiles = files;
        }
        
        async function openMagicFile(magicFile) {
            try {
                const zip = new JSZip();
                const zipContent = await zip.loadAsync(magicFile.file);
                
                // Buscar archivo SWF primero
                let swfFile = null;
                for (const [fileName, file] of Object.entries(zipContent.files)) {
                    if (fileName.toLowerCase().endsWith('.swf') && !file.dir) {
                        swfFile = file;
                        break;
                    }
                }
                
                if (swfFile) {
                    // Reproducir SWF con Ruffle
                    const swfBlob = await swfFile.async('blob');
                    const swfUrl = URL.createObjectURL(swfBlob);
                    activeBlobUrls.push({ url: swfUrl, type: 'content' }); // #3: registrar para liberar al cerrar
                    
                    const swfContainer = document.getElementById('fullscreenSwf');
                    const iframe = document.getElementById('fullscreenIframe');
                    
                    // Ocultar iframe, mostrar contenedor SWF
                    iframe.style.display = 'none';
                    swfContainer.style.display = 'block';
                    
                    // Crear elemento Ruffle
                    swfContainer.innerHTML = '';
                    const player = window.RufflePlayer.newest().createPlayer();
                    player.style.width = '100%';
                    player.style.height = '100%';
                    swfContainer.appendChild(player);
                    
                    // Prevenir menú contextual en el player
                    player.addEventListener('contextmenu', (e) => e.preventDefault());
                    swfContainer.addEventListener('contextmenu', (e) => e.preventDefault());
                    
                    await player.load(swfUrl);
                    
                    stopCodeScan();
                    document.getElementById('fullscreenContainer').style.display = 'block';
                    history.pushState({ fullscreen: true }, '');
                } else {
                    // Si no hay SWF, buscar index.html
                    const indexFile = zipContent.files['index.html'];
                    if (indexFile) {
                        const htmlContent = await indexFile.async('string');
                        const iframe = document.getElementById('fullscreenIframe');
                        const swfContainer = document.getElementById('fullscreenSwf');
                        
                        // Mostrar iframe, ocultar contenedor SWF
                        swfContainer.style.display = 'none';
                        iframe.style.display = 'block';
                        iframe.srcdoc = htmlContent;
                        
                        stopCodeScan();
                        document.getElementById('fullscreenContainer').style.display = 'block';
                        history.pushState({ fullscreen: true }, '');
                    } else {
                        console.error('El archivo magico no contiene .swf ni index.html');
                        showToast(`Librix sin contenido reproducible: ${magicFile.name}`); // #4 / Bug3
                    }
                }
            } catch (error) {
                console.error('Error abriendo archivo magico:', error);
                showToast(`Librix error al abrir: ${magicFile.name}`); // #4
            }
        }
        
        function closeFullscreen() {
            document.getElementById('fullscreenContainer').style.display = 'none';
            
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(err => {
                    console.log('Error saliendo de fullscreen:', err);
                });
            }
            
            // Limpiar ambos contenedores
            document.getElementById('fullscreenIframe').src = '';
            document.getElementById('fullscreenSwf').innerHTML = '';

            // #3: liberar blob URLs del contenido abierto (SWF o HTML)
            // Los íconos del grid se mantienen vivos mientras la grilla esté visible
            activeBlobUrls = activeBlobUrls.filter(entry => {
                if (entry.type === 'content') {
                    URL.revokeObjectURL(entry.url);
                    return false;
                }
                return true;
            });
        }
        
        // Cerrar fullscreen con botón Atrás del navegador/celular
        window.addEventListener('popstate', function(e) {
            const container = document.getElementById('fullscreenContainer');
            if (container.style.display === 'block') {
                closeFullscreen();
            }
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeFullscreen();
            }
        });
        
        // Service Worker mínimo - Solo para instalación PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js')
                    .then(function(registration) {
                        console.log('SW registrado');
                    })
                    .catch(function(error) {
                        console.log('SW error:', error);
                    });
            });
        }
    </script>
</body>
</html>
